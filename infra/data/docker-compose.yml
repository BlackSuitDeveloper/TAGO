# ============================================================================
# PRIVATE · EC2-data (sg-data, 공인 IP 없음)
# - PostgreSQL 18.7 (:5432) + Redis 8.4.8 (:6379, 비밀번호·AOF·noeviction)
# - sg-data 보안그룹에서 sg-web(:5432, :6379) 및 sg-ops(:9100, :9187, :9121)만 허용
# 실행: cd infra/data && docker compose up -d
# 모니터링 포함: docker compose --profile monitoring up -d
# ============================================================================
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:18.7-alpine
    container_name: tago-postgres
    restart: unless-stopped
    mem_limit: 1g
    logging: *default-logging
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-tago_db}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      TZ: Asia/Seoul
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-tago_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.4.8-alpine
    container_name: tago-redis
    restart: unless-stopped
    mem_limit: 384m
    logging: *default-logging
    ports:
      - "6379:6379"
    command:
      - "redis-server"
      - "--requirepass"
      - "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"
      - "--appendonly"
      - "yes"
      - "--maxmemory"
      - "${REDIS_MAXMEMORY:-256mb}"
      - "--maxmemory-policy"
      - "noeviction"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.21.1
    container_name: tago-postgres-exporter
    profiles: ["monitoring"]
    restart: unless-stopped
    mem_limit: 64m
    logging: *default-logging
    ports:
      - "9187:9187" # sg-ops Prometheus 수집 전용
    environment:
      DATA_SOURCE_NAME: "postgresql://${DB_USERNAME:-postgres}:${DB_PASSWORD:?DB_PASSWORD is required}@postgres:5432/${DB_NAME:-tago_db}?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy

  redis-exporter:
    image: oliver006/redis_exporter:v1.99.0
    container_name: tago-redis-exporter
    profiles: ["monitoring"]
    restart: unless-stopped
    mem_limit: 64m
    logging: *default-logging
    ports:
      - "9121:9121" # sg-ops Prometheus 수집 전용
    environment:
      REDIS_ADDR: "redis://redis:6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    depends_on:
      redis:
        condition: service_healthy

  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: tago-data-node-exporter
    profiles: ["monitoring"]
    restart: unless-stopped
    mem_limit: 64m
    logging: *default-logging
    ports:
      - "9100:9100" # sg-ops Prometheus 수집 전용
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"

volumes:
  postgres-data:
  redis-data:
