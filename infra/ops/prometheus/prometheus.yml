# ============================================================================
# EC2-ops Prometheus 설정
# 배포 전 WEB_IP(EC2-web 프라이빗 IP), DATA_IP(EC2-data 프라이빗 IP)를 실제 값으로 교체하세요.
# ============================================================================
global:
  scrape_interval: 10s
  evaluation_interval: 10s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # EC2-web Spring Boot Actuator (관리 전용 포트 8081)
  - job_name: "tago-app"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["WEB_IP:8081"]
        labels:
          application: "TAGO"
          instance: "ec2-web"

  # EC2-web / EC2-data 호스트 리소스 (node-exporter :9100)
  - job_name: "node-exporter"
    static_configs:
      - targets: ["WEB_IP:9100"]
        labels:
          instance: "ec2-web"
      - targets: ["DATA_IP:9100"]
        labels:
          instance: "ec2-data"

  # EC2-data PostgreSQL 지표 (:9187)
  - job_name: "postgres"
    static_configs:
      - targets: ["DATA_IP:9187"]
        labels:
          instance: "ec2-data"

  # EC2-data Redis 지표 (:9121)
  - job_name: "redis"
    static_configs:
      - targets: ["DATA_IP:9121"]
        labels:
          instance: "ec2-data"
