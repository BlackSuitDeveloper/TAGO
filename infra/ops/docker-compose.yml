# ============================================================================
# PRIVATE · EC2-ops (sg-ops, 공인 IP 없음)
# - Prometheus(:9090), Grafana(:3000), Alertmanager(:9093)는 127.0.0.1 바인딩 (SSH 터널 전용)
# - Loki(:3100)는 sg-web promtail 로그 수집용
# 실행: cd infra/ops && docker compose up -d
# 접속: ssh -J ubuntu@<web-IP> -L 3000:localhost:3000 -L 9090:localhost:9090 ubuntu@<ops-IP>
# ============================================================================
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  prometheus:
    image: prom/prometheus:v3.5.5
    container_name: tago-prometheus
    restart: unless-stopped
    mem_limit: 768m
    logging: *default-logging
    ports:
      - "127.0.0.1:9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../../monitoring/prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - alertmanager

  grafana:
    image: grafana/grafana:12.4.16
    container_name: tago-grafana
    restart: unless-stopped
    mem_limit: 512m
    logging: *default-logging
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      TZ: Asia/Seoul
    volumes:
      - ../../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
      - alertmanager

  loki:
    image: grafana/loki:3.6.22
    container_name: tago-loki
    restart: unless-stopped
    mem_limit: 256m
    logging: *default-logging
    ports:
      - "3100:3100" # sg-ops 에서 sg-web(promtail)만 허용
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ../../monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki

  alertmanager:
    image: prom/alertmanager:v0.34.2
    container_name: tago-alertmanager
    restart: unless-stopped
    mem_limit: 128m
    logging: *default-logging
    ports:
      - "127.0.0.1:9093:9093"
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    volumes:
      - ../../monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager

volumes:
  prometheus-data:
  alertmanager-data:
  loki-data:
  grafana-data:
