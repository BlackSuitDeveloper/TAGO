global:
  resolve_timeout: 5m

route:
  group_by: ["alertname", "severity"]
  group_wait: 15s
  group_interval: 5m
  repeat_interval: 1h
  receiver: "default-receiver"

receivers:
  - name: "default-receiver"
    # 실제 Slack / Discord / 이메일 알림 연동 시 아래 예시를 참고하여 활성화하세요.
