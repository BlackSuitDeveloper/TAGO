# ============================================================================
# 1번 스택: App (Nginx 프론트엔드 + Spring Boot 백엔드)
# 사전 조건: docker network create tago-net
# 실행: docker compose -f compose.app.yml up -d
# ============================================================================
services:
  backend:
    image: ${TAGO_BACKEND_IMAGE:-tago-backend:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tago-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SERVER_PORT: 8080
      TZ: Asia/Seoul
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - tago-net

  frontend:
    image: ${TAGO_FRONTEND_IMAGE:-tago-frontend:latest}
    build:
      context: ./frontend/TAGO_Front
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    container_name: tago-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - tago-net

networks:
  tago-net:
    external: true
