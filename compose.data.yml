# ============================================================================
# 2번 스택: Data (PostgreSQL + Redis)
# - 외부 인터넷에 포트를 열지 않고(ports 생략), tago-net 내부 통신만 허용
# 사전 조건: docker network create tago-net
# 실행: docker compose -f compose.data.yml up -d
# ============================================================================
services:
  postgres:
    image: postgres:18
    container_name: tago-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME:-tago_db}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required in .env}
      TZ: Asia/Seoul
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-tago_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tago-net

  redis:
    image: redis:7-alpine
    container_name: tago-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tago-net

volumes:
  postgres-data:
  redis-data:

networks:
  tago-net:
    external: true
