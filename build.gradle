plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.10'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.kedu'
version = '0.0.1-SNAPSHOT'
description = 'TAGO'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // 웹 / 데이터 (mybatis 스타터가 JDBC 를 함께 가져온다)
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:4.0.1'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    runtimeOnly 'org.postgresql:postgresql'

    // 공공데이터 API 응답(JSON) 파싱 - TagoApiClient 가 Jackson 2 (com.fasterxml) API 를 사용한다
    implementation 'com.fasterxml.jackson.core:jackson-databind'

    // 인증
    implementation 'com.auth0:java-jwt:4.4.0'
    implementation 'org.mindrot:jbcrypt:0.4'

    // 설정: 프로젝트 루트의 .env 파일을 환경변수처럼 읽는다
    implementation platform('me.paulschwarz:spring-dotenv-bom:5.1.0')
    implementation 'me.paulschwarz:springboot4-dotenv'

    // 개발 편의
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // 테스트
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// 소스·문서의 한글이 PC 기본 인코딩에 영향받지 않도록 UTF-8 로 고정
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'file.encoding', 'UTF-8'
}
