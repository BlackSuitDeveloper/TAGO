services:
  postgres:
    image: postgres:latest
    container_name: project-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: tago_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: tago1234
      TZ: Asia/Seoul
    volumes:
      - postgres-data:/var/lib/postgresql

  redis:
    image: redis:latest
    container_name: project-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data:
