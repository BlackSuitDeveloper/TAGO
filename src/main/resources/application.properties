# Values are read from environment variables (or the .env file in the project root).
# ${NAME}          : required. Startup fails if it is missing.
# ${NAME:default}  : optional. The default is used if it is missing.

# ---------- Application ----------
spring.application.name=TAGO
server.port=${SERVER_PORT:80}

# ---------- Database (PostgreSQL) ----------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ---------- MyBatis ----------
mybatis.mapper-locations=classpath:mapper/*.xml

# ---------- Redis (waiting queue) ----------
spring.data.redis.host=${REDIS_DB_URL:localhost}
spring.data.redis.port=${REDIS_DB_PORT:6379}
spring.data.redis.database=${REDIS_DB_DATABASE:0}
spring.data.redis.password=${REDIS_DB_PASSWORD:}
spring.data.redis.timeout=${REDIS_TIMEOUT:1000ms}
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT:1000ms}

# ---------- Scheduler ----------
spring.task.scheduling.pool.size=${SCHEDULER_POOL_SIZE:4}

# ---------- JWT ----------
jwt.secret=${JWT_SECRET}
# Token lifetime in milliseconds (default: 1 hour)
jwt.expiration=${JWT_EXPIRATION:3600000}

# ---------- Waiting queue ----------
tago.queue.max-active=${TAGO_QUEUE_MAX_ACTIVE:200}
tago.queue.batch-size=${TAGO_QUEUE_BATCH_SIZE:30}
tago.queue.token-ttl-seconds=${TAGO_QUEUE_TOKEN_TTL_SECONDS:300}
tago.queue.ghost-timeout-seconds=${TAGO_QUEUE_GHOST_TIMEOUT_SECONDS:30}

# ---------- Public data portal (TAGO) train info API ----------
tago.api.base-url=${TAGO_BASE_URL:https://apis.data.go.kr/1613000/TrainInfo}
tago.api.service-key=${TAGO_SERVICE_KEY:}
# External API timeouts (ms) and retries (transient errors only; attempts = total tries)
tago.api.connect-timeout-ms=${TAGO_CONNECT_TIMEOUT_MS:3000}
tago.api.read-timeout-ms=${TAGO_READ_TIMEOUT_MS:10000}
tago.api.max-attempts=${TAGO_MAX_ATTEMPTS:2}
tago.api.retry-backoff-ms=${TAGO_RETRY_BACKOFF_MS:500}
tago.sync.sliding-window-days=${TAGO_SLIDING_WINDOW_DAYS:3}
tago.sync.startup-enabled=${TAGO_STARTUP_SYNC_ENABLED:true}

# ---------- Email (SMTP) ----------
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.connectiontimeout=5000

# ---------- Monitoring (Actuator & Prometheus) ----------
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=when_authorized
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# ---------- Logging (Promtail) ----------
logging.file.name=logs/tago.log
