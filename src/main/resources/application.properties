spring.application.name=TAGO

server.port=80

spring.datasource.url=${DB_URL}

spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

jwt.expiration=${JWT_EXPIRATION}
jwt.secret=${JWT_SECRET}

server.servlet.context-path=/api

mybatis.mapper-locations=classpath:mapper/*.xml

spring.data.redis.host=${REDIS_DB_URL:localhost}
spring.data.redis.port=6379
spring.data.redis.database=0

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=100MB

gcp.credentials.location=${GCP_LOCATION}
gcp.project.id=${GCP_PROJECT_ID}

spring.ai.google.genai.api-key=${GENAI_API_KEY}
spring.ai.google.genai.chat.model=${GENAI_MODEL}

# 공공데이터포털 (TAGO) 열차정보 API 설정
tago.api.base-url=${TAGO_BASE_URL:https://apis.data.go.kr/1613000/TrainInfo}
tago.api.service-key=${TAGO_SERVICE_KEY:}
tago.sync.sliding-window-days=${TAGO_SLIDING_WINDOW_DAYS:3}
tago.sync.startup-enabled=${TAGO_STARTUP_SYNC_ENABLED:true}
